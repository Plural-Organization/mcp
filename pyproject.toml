[project]
name = "plural-mcp"
version = "0.1.0"
description = "The MCP gateway of Plural: lets Claude, ChatGPT or Grok send a chat's context to a Plural session."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = ["starlette>=0.46", "uvicorn>=0.34", "websockets>=15"]

[project.scripts]
plural-mcp = "plural_mcp.__main__:main"

[dependency-groups]
dev = ["httpx>=0.28", "pyright>=1.1.395", "pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.9"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plural_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "PT", "ASYNC", "RUF"]
ignore = ["ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC110"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
